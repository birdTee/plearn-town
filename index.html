<script>
// ---- UI icon set (ui_icons.webp, 18 cells in one row) — emoji are shown until it loads ----
// bump ASSET_V whenever an icon/emote picture changes, so phones download the new one instead of a cached copy
var ASSET_V='20261120t';
const IC_N=['logo','pad','freeze','hide','zombie','fire','flash','run','shirt','gear','globe','trophy','girl','boy','jump','tag','logout','hello'];
const IC={},IC_C={};
function icFrom(img,i,name){const n=img.height,c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(img,i*n,0,n,n,0,0,n,n);IC_C[name]=c;IC[name]=c.toDataURL();}
function applyIcons(root){(root||document).querySelectorAll('.ic[data-ic]:not(.on)').forEach(e=>{const u=IC[e.dataset.ic];if(u){e.style.backgroundImage=`url(${u})`;e.textContent='';e.classList.add('on');}});}
{const im=new Image();im.onload=()=>{IC_N.forEach((n,i)=>icFrom(im,i,n));applyIcons();};im.src='ui_icons.webp?v='+ASSET_V;}
{const im=new Image();im.onload=()=>{['bite','freezeLogo','bot','timer','look'].forEach((n,i)=>icFrom(im,i,n));applyIcons();};im.src='ui_icons2.webp?v='+ASSET_V;}
new MutationObserver(()=>applyIcons()).observe(document.body,{childList:true,subtree:true});
const FRAME_W = 170, FRAME_H = 244, N_FRAMES = 8, DRAW = 0.55; // HD frames drawn at ~half size => sharp on retina tablets

const LD={total:0,done:0};
function ldTick(){const pc=LD.total?Math.round(100*LD.done/LD.total):0;const f=document.getElementById('ldFill');if(f){f.style.width=pc+'%';document.getElementById('ldPct').textContent=pc>=100?'Ready ✓':'Loading '+pc+'%';
  try{if(!ready)['lgEnter','lgEnter2','lgEnter3'].forEach(id=>{const b=document.getElementById(id);if(b)b.textContent='Loading '+pc+'%';});}catch(e){}}}
function loadImg(src,tries){LD.total++;tries=tries||4;return new Promise(res=>{const fin=v=>{LD.done++;ldTick();res(v);};let n=0;
  const go=()=>{const im=new Image();im.onload=()=>(im.decode?im.decode().catch(()=>{}):Promise.resolve()).then(()=>fin(im));
   im.onerror=()=>{n++;if(n<tries)setTimeout(go,400*n);else fin(null);};im.src=n?src+(src.includes('?')?'&':'?')+'r='+n:src;};go();});}
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const TILE = 48, MW = 40, MH = 30; // map in tiles
const WORLD_W = MW*TILE, WORLD_H = MH*TILE;
// top 1/3 of the map = school front (castle gate + buildings) picture, then sidewalk / road / sidewalk, then the lawn
const BG_ROWS = 10, BG_H = BG_ROWS*TILE;           // 480px = 1/3 of 1440
const ROAD = {walkTop:10, road0:11, road1:12, walkBot:13};
const MIN_Y = BG_H + 26;                            // feet can't go above the sidewalk under the gate

// ---------- build map once ----------
function rng(seed){return ()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
const R = rng(7);
const MAPS=2;                                          // map drawn at 2x for sharp ground on retina/tablets
const map = document.createElement('canvas'); map.width = WORLD_W*MAPS; map.height = WORLD_H*MAPS;
const m = map.getContext('2d'); m.setTransform(MAPS,0,0,MAPS,0,0);
const isPath = (x,y)=> y>ROAD.walkBot && ((y===21||y===22) || (x===19||x===20) || ((x===6||x===33) && y>=15 && y<=27) || ((y===15||y===27) && x>=6 && x<=33));
const trees = [];
// sky is its own moving layer (see SKY below)
// ground below the school: a straight concrete road out of the gate, gravel on the left, lawn on the right
// (picture by ChatGPT: ground.webp, repeats vertically; flat colours are only shown until it loads)
const ROAD_HALF=230;                                   // half width of the road (world px)
const PZ={cx:20,cy:22};                                // kept for older code paths (no fountain any more)
// ground drawn in code (flat vector): fine grey gravel | concrete road | short lawn
{const G=rng(5), y0=BG_H, H0=WORLD_H-BG_H, L=WORLD_W/2-ROAD_HALF, Rr=WORLD_W/2+ROAD_HALF;
 // gravel: grey base + thousands of tiny grains
 m.fillStyle='#b4b6b9';m.fillRect(0,y0,L,H0);
 const gc=['#a3a5a9','#c3c5c8','#9a9da1','#d0d2d4','#acafb2','#bdbfc2'];
 for(let k=0;k<26000;k++){m.fillStyle=gc[(G()*gc.length)|0];const r=.7+G()*1.5;m.beginPath();m.arc(G()*L,y0+G()*H0,r,0,7);m.fill();}
 // lawn: soft mowing bands + many small tufts
 for(let x=Rr;x<WORLD_W;x+=64){m.fillStyle=((x-Rr)/64)%2?'#7bc46a':'#76bf65';m.fillRect(x,y0,64,H0);}
 for(let k=0;k<2600;k++){const x=Rr+12+G()*(WORLD_W-Rr-12),y=y0+G()*H0;m.strokeStyle=G()<.5?'#5fa851':'#8fd27c';m.lineWidth=1.2;m.lineCap='round';
   m.beginPath();m.moveTo(x-2,y);m.lineTo(x-3,y-4);m.moveTo(x,y);m.lineTo(x,y-5);m.moveTo(x+2,y);m.lineTo(x+3,y-4);m.stroke();}
 // concrete road
 m.fillStyle='#cfd1d4';m.fillRect(L,y0,Rr-L,H0);
 m.fillStyle='#b9bcc0';for(let y=y0+150;y<WORLD_H;y+=150)m.fillRect(L,y,Rr-L,2);       // slab joints
 m.fillRect(WORLD_W/2-ROAD_HALF/2,y0,2,H0);m.fillRect(WORLD_W/2+ROAD_HALF/2,y0,2,H0);

function teamRing(a){const ch=isChaser(a);let c=ch?'#ff4d4d':'#3fa9f5';if(MG.mode==='zombie'&&ch)c='#4ccf4c';if(MG.mode==='hide'&&ch)c='#ffd84a';if(a.found)c='#999';

// frozen: the kid inside a block of ice (like the reference: clear blue block, white edges, shine streaks, cracks, puddle)
const ICE=new Image();let iceOk=false;ICE.onload=()=>iceOk=true;ICE.src='ice.webp';
function drawIce(a,w,h){if(iceOk){const bh=h*1.08,bw=bh*ICE.width/ICE.height*1.12;ctx.save();ctx.globalAlpha=.5;ctx.drawImage(ICE,a.x-bw/2,a.y+8-bh,bw,bh);ctx.restore();return;}

function drawIceVec(a,w,h){const x=a.x,bw=w*.8,top=a.y-h*.84,bot=a.y+4,bh=bot-top,l=x-bw/2;
  ctx.save();ctx.fillStyle='rgba(200,240,255,.55)';ctx.beginPath();ctx.ellipse(x,a.y+3,bw*.62,bw*.16,0,0,7);ctx.fill();   // melt puddle
  ctx.beginPath();const pts=[[0,.08],[.2,0],[.62,.02],[.86,.06],[1,.2],[.97,.55],[1,.86],[.9,1],[.12,1],[0,.9],[.03,.5]];
  pts.forEach(([u,v],i)=>{const px=l+u*bw,py=top+v*bh;i?ctx.lineTo(px,py):ctx.moveTo(px,py);});ctx.closePath();
  ctx.fillStyle='rgba(150,220,255,.22)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineJoin='round';ctx.stroke();
  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(90,170,220,.9)';ctx.stroke();
  ctx.clip();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(l+bw*.18,top+bh*.75);ctx.lineTo(l+bw*.42,top+bh*.12);ctx.stroke();
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(l+bw*.32,top+bh*.86);ctx.lineTo(l+bw*.56,top+bh*.3);ctx.stroke();
  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.moveTo(l+bw*.8,top+bh*.2);ctx.lineTo(l+bw*.66,top+bh*.42);ctx.lineTo(l+bw*.78,top+bh*.55);ctx.moveTo(l+bw*.66,top+bh*.42);ctx.lineTo(l+bw*.55,top+bh*.48);ctx.stroke();
  ctx.restore();
  ctx.fillStyle='#fff';[[.1,.3,3],[.95,.4,2.5],[.5,-.05,2.5],[1.05,.7,2]].forEach(([u,v,r])=>{ctx.beginPath();ctx.arc(l+u*bw,top+v*bh,r,0,7);ctx.fill();});}
// hide & seek: whole map 75% dark; every seeker carries a flashlight cone in the direction they face
const DARK=document.createElement('canvas');const DIR_ANG={right:0,downright:Math.PI/4,down:Math.PI/2,downleft:3*Math.PI/4,left:Math.PI,upleft:-3*Math.PI/4,up:-Math.PI/2,upright:-Math.PI/4};
function drawDarkness(){if(!(MG.on&&MG.mode==='hide'&&(MG.phase==='play'||MG.phase==='count')))return;
  if(DARK.width!==cv.width||DARK.height!==cv.height){DARK.width=cv.width;DARK.height=cv.height;}
  const g=DARK.getContext('2d');g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';g.clearRect(0,0,DARK.width,DARK.height);
  g.fillStyle='rgba(8,12,30,.75)';g.fillRect(0,0,DARK.width,DARK.height);
  g.setTransform(dpr*Z,0,0,dpr*Z,-cam.x*dpr*Z,-cam.y*dpr*Z);g.globalCompositeOperation='destination-out';
  const lightOn=MG.phase==='play'&&MG.seekT<=0;
  for(const p of MG.players){
    if(isChaser(p)&&lightOn){const ang=DIR_ANG[p.dir]||0,L=FLASH_L()+(p.z||0)*3,half=FLASH_A,ox=p.x,oy=p.y-30-(p.z||0);
      const gr=g.createRadialGradient(ox,oy,10,ox,oy,L);gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(.75,'rgba(0,0,0,.9)');gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr;g.beginPath();g.moveTo(ox,oy);g.arc(ox,oy,L,ang-half,ang+half);g.closePath();g.fill();}
    if(p===P||isChaser(p)){const r=p===P?70:45;const gr=g.createRadialGradient(p.x,p.y-30,5,p.x,p.y-30,r);gr.addColorStop(0,'rgba(0,0,0,.75)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y-30,r,0,7);g.fill();}}
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(DARK,0,0);ctx.restore();
  if(P.mg){ctx.save();ctx.setTransform(dpr*Z,0,0,dpr*Z,0,0);ctx.translate(-cam.x,-cam.y);MG.players.filter(p=>isChaser(p)||p.found).sort((a,b)=>a.y-b.y).forEach(s=>{drawActor(s,false);if(s.found)drawFoundMark(s);});ctx.restore();}
  if(MG.seekT>0&&MG.seekerIsP){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(0,0,cv.width,cv.height);ctx.restore();}}
const FLASH_L=()=>330,FLASH_A=0.6;   // flashlight length (world px) and half-angle (~34°)
function inFlash(s,h){const dx=h.x-s.x,dy=(h.y-30)-(s.y-30-(s.z||0));const d=Math.hypot(dx,dy);if(d<70)return true;if(d>FLASH_L()+(s.z||0)*3)return false;let da=Math.atan2(dy,dx)-(DIR_ANG[s.dir]||0);da=Math.atan2(Math.sin(da),Math.cos(da));return Math.abs(da)<FLASH_A;}

// ---------- tag ----------
const TAG_R=()=>80*S.scale/0.7;
function doTag(a){if(a.tagCd>0||a.frozen||a.found)return;a.tagCd=.45;const zb=charFor(a).startsWith('zombie');a.pop={txt:zb?'Chomp!':'Tag!',t:0};if(zb)a.biteUntil=performance.now()+380;
  if(!MG.on||MG.phase!=='play'||!a.mg)return;
  let best=null,bd=TAG_R();
  for(const b of MG.players){if(b===a)continue;const d=dist(a,b);if(d>bd)continue;if(canTag(a,b)){best=b;bd=d;}}
  if(!best)return;
  if(MG.online&&!MG.isHost&&a===P){NET.tg={to:idOf(best),k:++NET.k};NET.sendT=0;return;}   // the host decides
  if(MG.online&&MG.isHost&&a===P){NET.tg={to:idOf(best),k:++NET.k};NET.sendT=0;}
  applyTag(a,best);}
function isChaser(a){return a.role==='it'||a.role==='zombie'||a.role==='seeker';}
// Freeze / Zombie Tag: chasers wait 3 s after Go! so runners can scatter first
const GAME_T=45,SEEK_T=0;   // every mini-game lasts 45 s; Hide & Seek seekers keep their eyes closed for the first 3 s
function zombieK(){if(window.ZK_FIX)return window.ZK_FIX;return .8;}   // zombies run at 0.8x a kid's speed   // zombie speed vs a normal walker, tuned by simulation so about half the games are won by zombies: 4 players .90, 7 .80, 10 .70, 13 .60
const HEAD=5;   // head start: runners run right away, chasers wait 5 s
const inGrace=a=>MG.on&&MG.phase==='count'&&isChaser(a);
function canTag(a,b){if(MG.phase!=='play'||inGrace(a))return false;if(MG.mode==='freeze'){if(a.role==='it')return b.role==='run'&&!b.frozen;return a.role==='run'&&b.role==='run'&&b.frozen;}
  if(MG.mode==='zombie')return a.role==='zombie'&&b.role==='human';
  if(MG.mode==='hide')return false;   /* caught by the light, not by tagging */
  return false;}
function applyTag(a,b){
  if(MG.mode==='freeze'){if(a.role==='it'){b.frozen=true;b.moving=false;b.jt=null;b.z=0;b.pop={txt:'Frozen!',t:0};}else{b.frozen=false;b.pop={txt:'Saved!',t:0};}}
  else if(MG.mode==='zombie'){b.role='zombie';b.pop={txt:'Zombie!',t:0};}
  else if(MG.mode==='hide'){b.found=true;b.moving=false;b.pop={txt:'Found!',t:0};}
  checkEnd();}

function mgStart(){leaveHomeNow();mgClose();if(MG.online&&MG.isHost)mgList();const ps=[P,...MG.joined,...(MG.online&&MG.isHost?MG.bots||[]:[])];MG.players=ps;MG.on=true;MG.phase='count';MG.t=HEAD;MG.seekT=0;MG.win=null;
  // everyone starts from where they are standing now

const BAD=['fuck','shit','bitch','asshole','dick','pussy','bastard','cunt','slut','whore','nigger','nigga','retard','stupid','idiot','dumb','loser','sexy','sex','porn','kill yourself','kys',

const LEET={a:'[a4@]',e:'[e3]',i:'[i1!|]',o:'[o0]',s:'[s5$]',t:'[t7]',u:'[uv]'};
const BAD_RE=BAD.map(w=>{const th=/[^\x00-\x7f]/.test(w),sep=th?'\\s*':'[\\W_]*';return new RegExp([...w].map(c=>c===' '?sep:(LEET[c]||c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'))+(th?'':'+')).join(sep),'gi');});
function cleanChat(t){t=String(t||'').replace(/[\u0000-\u001f\u007f​-‏‪-‮]/g,'').replace(/\s+/g,' ').trim().slice(0,60);
  t=t.replace(/(https?:\/\/|www\.)\S*/gi,'***').replace(/\S+\.(com|net|org|co|th|me|ly|gg|io)\b\S*/gi,'***');
  t=t.replace(/(\d[\s\-.]*){6,}/g,'***');                       // phone numbers / ids
  for(const re of BAD_RE)t=t.replace(re,m=>'*'.repeat(Math.min(5,Math.max(3,m.length))));
  return t;}

function chatVisible(a){if(a!==P&&(!sameMap(a)||(MAPID==='home'&&NPCS.includes(a))||hiddenForMe(a)||dist(a,P)>CHAT_R))return false;return true;}
function wrapLines(t,maxW){const words=t.split(' '),out=[];let cur='';
  for(const w of words){const tryS=cur?cur+' '+w:w;if(ctx.measureText(tryS).width<=maxW||!cur)cur=tryS;else{out.push(cur);cur=w;}}if(cur)out.push(cur);
  // very long words (or Thai with no spaces): cut by width
  const res=[];for(let l of out){while(ctx.measureText(l).width>maxW&&l.length>1){let k=l.length;while(k>1&&ctx.measureText(l.slice(0,k)).width>maxW)k--;res.push(l.slice(0,k));l=l.slice(k);}res.push(l);}
  return res.slice(0,3);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function headTop(a){const h=FRAME_H*S.scale*DRAW;return a.y-h+h*0.24-(a.z||0)-(MG.on&&a.mg?34:20);}
function drawEmoteIcon(i,cx,cy,sz){
  const c=EMO_IMG.height,cell=emoCell(i,true);if(emoOk&&(cell+1)*c<=EMO_IMG.width){ctx.drawImage(EMO_IMG,cell*c,0,c,c,cx-sz/2,cy-sz/2,sz,sz);return;}
  // fallback: white bubble + emoji
  ctx.fillStyle='#fff';ctx.strokeStyle='#3b2a1a';ctx.lineWidth=2.5;rr(cx-sz*.42,cy-sz*.4,sz*.84,sz*.72,sz*.2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-sz*.18,cy+sz*.3);ctx.lineTo(cx-sz*.26,cy+sz*.46);ctx.lineTo(cx-sz*.02,cy+sz*.3);ctx.fill();
  const E=EMOTES[i].e;ctx.textAlign='center';ctx.textBaseline='middle';
  if(E==='GG'||E==='555'){ctx.font='800 '+Math.round(sz*(E==='GG'?.38:.3))+'px Mali, sans-serif';ctx.fillStyle=E==='GG'?'#2fa84f':'#f39a1e';ctx.fillText(E,cx,cy-sz*.04);}
  else{ctx.font=Math.round(sz*.42)+'px sans-serif';ctx.fillStyle='#000';ctx.fillText(E,cx,cy-sz*.03);}}
function drawChat(dt){chatBots(dt);const now=performance.now();
  const all=[P,...REMOTE.values(),...(npcsOn()?NPCS:NPCS.filter(n=>n.mg))];
  ctx.save();ctx.setTransform(dpr*Z,0,0,dpr*Z,0,0);ctx.translate(-cam.x,-cam.y);const boxes=[];
  for(const a of all){if(!a.say&&!a.emo)continue;
    if(a.say&&now-a.say.t0>SAY_MS+a.say.txt.length*40)a.say=null;if(a.emo&&now-a.emo.t0>EMO_MS)a.emo=null;
    if(!chatVisible(a))continue;let top=headTop(a);
    if(a.emo){const u=(now-a.emo.t0)/1000,pop=u<.25?.4+.8*(u/.25):(u<.4?1.2-.2*((u-.25)/.15):1),bob=Math.sin(u*6)*2.5,fade=Math.min(1,(EMO_MS/1000-u)/.3);
      const sz=50*pop,hh=FRAME_H*S.scale*DRAW;ctx.globalAlpha=Math.max(0,fade);drawEmoteIcon(a.emo.i,a.x+hh*.36+8,top+6+bob,sz);ctx.globalAlpha=1;top-=14;}
    if(a.say){const u=(now-a.say.t0),life=SAY_MS+a.say.txt.length*40,fade=Math.min(1,(life-u)/300),k=Math.min(1,u/150);
      ctx.font='600 14px Mali, sans-serif';const lines=wrapLines(a.say.txt,170);const lw=Math.max(...lines.map(l=>ctx.measureText(l).width));
      const bw=lw+20,bh=lines.length*18+12;boxes.push({a,lines,bw,bh,bx:a.x-bw/2,by:top-bh-8+(1-k)*6,al:Math.max(0,fade)*(.4+.6*k)});}}
  // bubbles of kids standing close together must not cover each other: the one in front keeps its place, others move up
  boxes.sort((p,q)=>q.a.y-p.a.y);const placed=[];
  for(const B of boxes){for(let n=0;n<8;n++){const o=placed.find(p=>B.bx<p.bx+p.bw+4&&p.bx<B.bx+B.bw+4&&B.by<p.by+p.bh+4&&p.by<B.by+B.bh+4);if(!o)break;B.by=o.by-B.bh-6;}placed.push(B);}
  for(const B of boxes){const a=B.a,{bx,by,bw,bh}=B;ctx.globalAlpha=B.al;ctx.font='600 14px Mali, sans-serif';
      ctx.fillStyle=a===P?'#fff8d8':'#ffffff';ctx.strokeStyle='#3b2a1a';ctx.lineWidth=2.2;rr(bx,by,bw,bh,10);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(a.x-7,by+bh-1);ctx.lineTo(a.x,by+bh+8);ctx.lineTo(a.x+7,by+bh-1);ctx.fill();
      ctx.beginPath();ctx.moveTo(a.x-7,by+bh);ctx.lineTo(a.x,by+bh+8);ctx.lineTo(a.x+7,by+bh);ctx.stroke();
      ctx.fillStyle='#3b2a1a';ctx.textAlign='center';ctx.textBaseline='top';B.lines.forEach((l,i)=>ctx.fillText(l,a.x,by+7+i*18));ctx.globalAlpha=1;}
  ctx.restore();}

const mtof=m=>440*Math.pow(2,(m-69)/12);
// one synth note: type, midi or freq, start, length, volume, destination, options (slide to, vibrato, filter)
function tone(o){const ac=SND.ac,t=o.t,len=o.len||.2,f=o.f||mtof(o.m);
  const osc=ac.createOscillator();osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);
  if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+(o.slide||len));
  if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=o.vib;lg.gain.value=f*(o.vibD||.03);l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+len+.05);}
  const g=ac.createGain(),v=o.v||.3,a=o.a||.005;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);
  g.gain.exponentialRampToValueAtTime(.0008,t+len);let node=osc;
  if(o.lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;fl.Q.value=o.q||1;osc.connect(fl);node=fl;}
  node.connect(g);g.connect(o.dest);osc.start(t);osc.stop(t+len+.05);}
function noise(o){const ac=SND.ac,s=ac.createBufferSource();s.buffer=SND.noise;const f=ac.createBiquadFilter();f.type=o.ft||'highpass';f.frequency.value=o.ff||7000;
  const g=ac.createGain();g.gain.setValueAtTime(o.v||.1,o.t);g.gain.exponentialRampToValueAtTime(.0008,o.t+(o.len||.05));s.connect(f);f.connect(g);g.connect(o.dest);s.start(o.t);s.stop(o.t+(o.len||.05)+.02);}

function sfxAt(a,fn){if(!SND.ac||!SND.sounds)return;let vol=1,pan=0;

  fn(ac.currentTime+.01,out);}

const SONG_STEPS=16*16;
function musicTick(){const ac=SND.ac;if(!ac||ac.state!=='running')return;
  const want=(MG.on&&(MG.phase==='count'||MG.phase==='play'))?'game':'calm';
  if(want!==SND.track){SND.track=want;SND.step=0;const g=SND.mus.gain,t=ac.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(0,t);g.linearRampToValueAtTime(SND.music?.38:0,t+.5);SND.next=Math.max(SND.next,t+.05);
    if(want==='game')SND.crash=true;}
  const T=TRACKS[SND.track];SND.fast=SND.track==='game'&&MG.phase==='play'&&MG.t<10;
  const sp16=60/(T.bpm*(SND.fast?1.12:1))/4;                 // seconds per 16th note
  while(SND.next<ac.currentTime+.12){const s=SND.step,sw=(T.swing&&s%4===2)?sp16*T.swing:0;playStep(T,s,SND.next+sw,sp16);SND.next+=sp16;SND.step=(s+1)%SONG_STEPS;}}
function kick(t,d,v){tone({type:'sine',f:160,to:42,slide:.13,len:.2,v,t,dest:d});}
function snare(t,d,v){noise({t,len:.14,v,ff:1700,ft:'bandpass',dest:d});tone({type:'triangle',f:220,to:160,slide:.06,len:.08,v:v*.6,t,dest:d});}
function clap(t,d,v){for(let i=0;i<3;i++)noise({t:t+i*.011,len:.07,v:v*(i===2?1:.6),ff:1300,ft:'bandpass',dest:d});}
function playStep(T,s,t,sp){const d=SND.mus,bar=Math.floor(s/16),q=s%16,ch=CHORDS[T.chords[bar]],game=SND.track==='game';
  const e8=q%2===0?T.mel[bar][q/2]:0;
  if(!game){
    // marimba melody (sine + soft octave overtone, quick decay)
    if(e8){tone({type:'sine',m:e8,len:.42,v:.2,t,dest:d});tone({type:'sine',m:e8+12,len:.12,v:.05,t,dest:d});}
    const b8=q%2===0?T.bell[bar][q/2]:0;if(b8)tone({type:'sine',m:b8,len:.6,v:.07,t,dest:d,vib:5,vibD:.004});
    // walking bass on quarter notes: root, 5th, octave, 5th
    if(q%4===0){const r=ch[0]-12,w=[r,r+7,r+12,r+7][q/4];tone({type:'triangle',m:w,len:sp*3.4,v:.26,t,dest:d});}
    // pizzicato chord stabs on the off-beats
    if(q%4===2)ch.forEach((n,i)=>tone({type:'triangle',m:n+12,len:.12,v:.05,t:t+i*.008,dest:d,lp:2800}));
    if(q===0||q===8)kick(t,d,.3);
    if(q===4||q===12)clap(t,d,.16);
    if(q%2===0)noise({t,len:.025,v:q%4===2?.04:.02,dest:d});                       // shaker
    if(bar===15&&q>=8&&q%2===0)tone({type:'sine',m:[84,86,88,91][(q-8)/2],len:.15,v:.06,t,dest:d});   // little run into the loop
  }else{
    // square lead (+ a quiet detuned copy for a fatter sound)
    if(e8){tone({type:'square',m:e8,len:sp*1.8,v:.075,t,dest:d,lp:3200});tone({type:'sawtooth',f:mtof(e8)*1.006,len:sp*1.8,v:.03,t,dest:d,lp:2200});}
    // octave-jumping bass on 8ths
    if(q%2===0)tone({type:'sawtooth',m:ch[0]-12+((q/2)%2?12:0),len:sp*1.7,v:.17,t,dest:d,lp:1000,q:5});
    // fast arpeggio on 16ths
    tone({type:'square',m:ch[q%3]+24+(q%6>=3?12:0),len:sp*.7,v:.026,t,dest:d,lp:3800});
    // drums: four on the floor, snare on 2 & 4, 8th hats with open hat on the off-beat
    if(q%4===0)kick(t,d,.5);if(q===14&&bar%2===1)kick(t,d,.35);
    if(q===4||q===12)snare(t,d,.22);
    if(q%2===0)noise({t,len:q%4===2?.09:.03,v:q%4===2?.06:.04,dest:d});
    if(SND.fast)noise({t,len:.02,v:.03,dest:d});                                   // last 10 s: busier hats
    // fill at the end of every 8 bars, crash at the start of each section
    if((bar===7||bar===15)&&q>=8)snare(t,d,.08+(q-8)*.025);
    if(q===0&&(bar===0||bar===8)||SND.crash){SND.crash=false;noise({t,len:1.1,v:.09,ff:5000,dest:d});}
  }}

function setSounds(on){SND.sounds=on;lsSet('sw_sounds',on);if(SND.ac)SND.sfx.gain.value=on?.55:0;}

  const go=()=>{loggedIn=true;window.__inGame=true;resize();requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById('loading').classList.add('done')));};
  if(window.__landP){const t0=performance.now();Promise.race([window.__landP,new Promise(r=>setTimeout(r,800))]).then(()=>setTimeout(go,Math.max(0,250-(performance.now()-t0))));window.__landP=null;}else go();}
$('lgEnter').onclick=async()=>{const name=$('nameIn').value.trim(),a=$('pinA').value,err=$('lgErr');
  if(!name){err.textContent='Please type your nickname';return;}if(!/^\d{4}$/.test(a)){err.textContent='PIN must be 4 numbers';return;}
  const prof={name,g:LG.g,h:LG.h,c:LG.c,pin:await hashPin(a)};store.set('sw_profile',prof);enterGame(prof);};
$('lgEnter2').onclick=async()=>{const prof=store.get('sw_profile');const pin=$('pinIn').value;
  if(!prof)return;if(await hashPin(pin)!==prof.pin){$('lgErr2').textContent='Wrong PIN';$('pinIn').value='';return;}enterGame(prof);};
$('pinIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('lgEnter2').click();});
$('lgNew').onclick=()=>{$('loading').classList.remove('simple');$('lgBack').style.display='none';$('lgNewCard').style.display='block';lgBuild();};
['nameIn','pinA','pinIn'].forEach(id=>$(id).addEventListener('input',e=>{if(id!=='nameIn')e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);$('lgErr').textContent='';$('lgErr2').textContent='';}));
(function initLogin(){const prof=store.get('sw_profile'),ses=store.get('sw_session');
  if(prof&&prof.name){$('lgNewCard').style.display='none';LG.g=prof.g;LG.h=prof.h;LG.c=prof.c;
    $('loading').classList.add('simple');
    if(ses&&ses.on){$('lgWelcome').style.display='flex';$('lgWName').textContent=prof.name;}   // remembered: no PIN
    else{$('lgBack').style.display='block';$('lgName').textContent=prof.name;}}                    // after log out: PIN
  lgBuild();})();
$('lgEnter3').onclick=()=>{const prof=store.get('sw_profile');if(prof)enterGame(prof);};
$('lgNew2').onclick=()=>{$('loading').classList.remove('simple');$('lgWelcome').style.display='none';$('lgNewCard').style.display='block';lgBuild();};
$('logoutBtn').onclick=()=>{store.set('sw_session',{on:false});location.reload();};
(function boot(){const t0=Date.now();let p=8;const tick=()=>{p=ready?100:Math.min(92,p+(92-p)*.06);const f=$('bootFill');if(f)f.style.width=p+'%';
  if(ready&&Date.now()-t0>1500){setTimeout(()=>$('loading').classList.remove('booting'),300);return;}setTimeout(tick,120);};tick();})();
function onLoaded(){lgReady();lgBuild();if(tryResume())return;const prof=store.get('sw_profile');if(prof){lgPreview($('lgPrev2'),prof.g,prof.h,prof.c);lgPreview($('lgPrev3'),prof.g,prof.h,prof.c);}}

loadAll();
requestAnimationFrame(loop);
</script>
</body>
</html>
